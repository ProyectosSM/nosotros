<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrador - Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-4">
    <div class="container" style="max-width: 900px;">
        <div class="card shadow-sm p-4 mb-4 bg-white">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <h3 class="fw-bold mb-1">Panel de Administración</h3>
                    <p class="text-muted mb-0">Fiscales Registrados en el Sistema</p>
                </div>
                <div class="d-flex align-items-center gap-3">
                    <a href="/app.html" class="btn btn-outline-primary btn-sm">Ir al Formulario</a>
                    <a href="/" class="btn btn-outline-danger btn-sm">Salir</a>
                    <img src="logo_nosotros.png" alt="Logo" style="height: 55px;">
                </div>
            </div>
        </div>

        <div class="card shadow-sm p-4 bg-white">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="fw-bold mb-0">Lista de Usuarios (<span id="totalUsuarios">0</span>)</h5>
                <button class="btn btn-sm btn-secondary" onclick="cargarUsuarios()">🔄 Actualizar Lista</button>
            </div>

            <div class="table-responsive">
                <table class="table table-hover table-bordered align-middle text-center">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Nombre del Fiscal</th>
                            <th>Mesa</th>
                            <th>Usuario</th>
                            <th>Contraseña</th>
                            <th>Rol</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody id="tablaUsuarios">
                        <tr><td colspan="7">Cargando usuarios...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function cargarUsuarios() {
            const res = await fetch('/api/usuarios');
            const usuarios = await res.json();
            const tbody = document.getElementById('tablaUsuarios');
            document.getElementById('totalUsuarios').textContent = usuarios.length;
            tbody.innerHTML = '';

            usuarios.forEach(u => {
                const badgeRol = u.rol === 'admin' 
                    ? '<span class="badge bg-danger">Admin</span>' 
                    : '<span class="badge bg-primary">Fiscal</span>';

                const btnEliminar = u.rol === 'admin' 
                    ? '-' 
                    : `<button class="btn btn-sm btn-danger" onclick="eliminarUsuario(${u.id})">Eliminar</button>`;

                tbody.innerHTML += `
                    <tr>
                        <td>${u.id}</td>
                        <td class="fw-bold">${u.nombre_fiscal}</td>
                        <td>${u.numero_mesa}</td>
                        <td>${u.usuario}</td>
                        <td><code>${u.password}</code></td>
                        <td>${badgeRol}</td>
                        <td>${btnEliminar}</td>
                    </tr>
                `;
            });
        }

        async function eliminarUsuario(id) {
            if (!confirm('¿Seguro que deseas eliminar este usuario?')) return;
            await fetch(`/api/usuarios/${id}`, { method: 'DELETE' });
            cargarUsuarios();
        }

        cargarUsuarios();
    </script>
</body>
</html>
