<!DOCTYPE html>
<html lang="es">
<head>
    
    <link rel="manifest" href="/manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transmisión de Escrutinio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container my-4" style="max-width: 700px;">
        <!-- Cabecera con Logo a la Derecha -->
        <div class="card shadow-sm p-4 mb-4 bg-white">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <h3 class="fw-bold mb-1">Reporte de Mesa</h3>
                    <p class="text-muted mb-0">Sistema de Control Electoral</p>
                </div>
                <div>
                    <img src="logo_nosotros.png" alt="Logo" style="height: 70px;">
                </div>
            </div>
        </div>

        <div class="card shadow-sm p-4 bg-white">
            <div class="mb-3">
                <label class="form-label fw-bold">Centro de Votación</label>
                <input type="text" id="centro_votacion" class="form-control" required placeholder="Ej. Escuela Oficial Urbana...">
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Coordinador de Centro</label>
                    <input type="text" id="coordinador_centro" class="form-control" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Nombre de Abogado</label>
                    <input type="text" id="nombre_abogado" class="form-control" required>
                </div>
            </div>

            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label fw-bold">Fiscal Informático</label>
                    <input type="text" id="fiscal_informatico" class="form-control" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label fw-bold">Nombre del Fiscal</label>
                    <input type="text" id="nombre_fiscal" class="form-control" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label fw-bold">Número de Mesa</label>
                    <input type="text" id="numero_mesa" class="form-control" required>
                </div>
            </div>

            <hr class="my-4">

            <!-- Contadores Interactivos -->
            <div class="row text-center mb-4">
                <div class="col-md-6 mb-3">
                    <div class="p-3 border rounded bg-light">
                        <h5 class="text-success fw-bold">Votos a Favor</h5>
                        <input type="number" id="votos_favor" class="form-control text-center fs-3 fw-bold mb-3" value="0" min="0" readonly>
                        <button type="button" class="btn btn-success btn-lg w-100" onclick="modificarContador('votos_favor', 1)">+ Voto a Favor</button>
                    </div>
                </div>
                <div class="col-md-6 mb-3">
                    <div class="p-3 border rounded bg-light">
                        <h5 class="text-danger fw-bold">Votos Nulos</h5>
                        <input type="number" id="votos_nulos" class="form-control text-center fs-3 fw-bold mb-3" value="0" min="0" readonly>
                        <button type="button" class="btn btn-danger btn-lg w-100" onclick="modificarContador('votos_nulos', 1)">+ Voto Nulo</button>
                    </div>
                </div>
            </div>

            <!-- Botón de Envío Directo a WhatsApp -->
            <div class="d-grid gap-2">
                <button type="button" class="btn btn-success btn-lg py-3 fw-bold shadow" onclick="enviarWhatsApp()">
                    📤 Enviar Reporte por WhatsApp (+502 41714540)
                </button>
            </div>
        </div>
        
        <div class="text-center mt-3">
            <a href="/" class="text-danger text-decoration-none">Cerrar Sesión</a>
        </div>
    </div>

    <script>
        function modificarContador(idCampo, cambio) {
            let input = document.getElementById(idCampo);
            let valorActual = parseInt(input.value) || 0;
            let nuevoValor = valorActual + cambio;
            if (nuevoValor >= 0) {
                input.value = nuevoValor;
            }
        }

        function enviarWhatsApp() {
            let centro = document.getElementById('centro_votacion').value;
            let coordinador = document.getElementById('coordinador_centro').value;
            let abogado = document.getElementById('nombre_abogado').value;
            let informatico = document.getElementById('fiscal_informatico').value;
            let fiscal = document.getElementById('nombre_fiscal').value;
            let mesa = document.getElementById('numero_mesa').value;
            let favor = document.getElementById('votos_favor').value;
            let nulos = document.getElementById('votos_nulos').value;

            if(!centro || !mesa || !fiscal) {
                alert('Por favor completa al menos el Centro de Votación, Número de Mesa y Nombre del Fiscal.');
                return;
            }

            let texto = `📊 *REPORTE OFICIAL DE MESA* 📊\n\n` +
                        `🏢 *Centro:* ${centro}\n` +
                        `🔢 *Mesa:* ${mesa}\n` +
                        `👤 *Fiscal:* ${fiscal}\n` +
                        `⚖️ *Abogado:* ${abogado}\n` +
                        `💻 *Informático:* ${informatico}\n` +
                        `📋 *Coordinador:* ${coordinador}\n\n` +
                        `✅ *Votos a Favor:* ${favor}\n` +
                        `❌ *Votos Nulos:* ${nulos}`;

            let telefono = "50241714540";
            let url = `https://api.whatsapp.com/send?phone=${telefono}&text=${encodeURIComponent(texto)}`;
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
