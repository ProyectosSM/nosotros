<!DOCTYPE html>
<html lang="es">
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Control Electoral</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" href="logo_nosotros.png">
</head>
<body class="bg-light d-flex align-items-center py-4" style="min-height: 100vh;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-sm p-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h4 class="fw-bold mb-0">Control Electoral</h4>
                        <img src="logo_nosotros.png" alt="Logo" style="height: 55px;">
                    </div>

                    <!-- Pestañas Login / Registro -->
                    <ul class="nav nav-pills nav-fill mb-3" id="pills-tab" role="tablist">
                        <li class="nav-item">
                            <button class="nav-link active fw-bold" data-bs-toggle="pill" data-bs-target="#tab-login" type="button">Iniciar Sesión</button>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link fw-bold" data-bs-toggle="pill" data-bs-target="#tab-registro" type="button">Crear mi Cuenta</button>
                        </li>
                    </ul>

                    <div class="tab-content">
                        <!-- Formulario Login -->
                        <div class="tab-pane fade show active" id="tab-login">
                            <form action="/login" method="POST">
                                <div class="mb-3">
                                    <label class="form-label">Usuario</label>
                                    <input type="text" name="usuario" class="form-control" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Contraseña</label>
                                    <input type="password" name="password" class="form-control" required>
                                </div>
                                <button type="submit" class="btn btn-primary w-100 fw-bold">Ingresar</button>
                            </form>
                        </div>

                        <!-- Formulario Registro Público -->
                        <div class="tab-pane fade" id="tab-registro">
                            <form id="formRegistro">
                                <div class="mb-2">
                                    <label class="form-label">Tu Nombre Completo</label>
                                    <input type="text" id="reg_nombre" class="form-control" required placeholder="Ej. Juan Pérez">
                                </div>
                                <div class="mb-2">
                                    <label class="form-label">Número de Mesa</label>
                                    <input type="text" id="reg_mesa" class="form-control" required placeholder="Ej. Mesa 05">
                                </div>
                                <div class="row">
                                    <div class="col-6 mb-3">
                                        <label class="form-label">Crea tu Usuario</label>
                                        <input type="text" id="reg_usuario" class="form-control" required placeholder="Ej. juan05">
                                    </div>
                                    <div class="col-6 mb-3">
                                        <label class="form-label">Crea tu Contraseña</label>
                                        <input type="password" id="reg_password" class="form-control" required>
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-success w-100 fw-bold">Registrarme</button>
                            </form>
                            <div id="msgRegistro" class="mt-2"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('formRegistro').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msg = document.getElementById('msgRegistro');
            msg.innerHTML = '<div class="alert alert-info py-2">Creando cuenta...</div>';

            const datos = {
                nombre_fiscal: document.getElementById('reg_nombre').value.trim(),
                numero_mesa: document.getElementById('reg_mesa').value.trim(),
                usuario: document.getElementById('reg_usuario').value.trim(),
                password: document.getElementById('reg_password').value.trim()
            };

            const res = await fetch('/registro', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datos)
            });

            const data = await res.json();
            if (data.ok) {
                msg.innerHTML = '<div class="alert alert-success py-2">✅ ¡Cuenta creada! Ya puedes iniciar sesión en la primera pestaña.</div>';
                document.getElementById('formRegistro').reset();
            } else {
                msg.innerHTML = `<div class="alert alert-danger py-2">❌ ${data.error}</div>`;
            }
        });
    </script>
</body>
</html>
